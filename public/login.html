<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — TIFR Hyderabad</title>
    <link rel="icon" href="/assets/img/favicon.ico" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-visual">
        <img
          src="/assets/img/bhabha.jpg"
          alt="Portrait of Homi J. Bhabha"
        />
        <a href="/" class="auth-logo-badge">
          <img src="/assets/img/tifr-hyderabad-logo.png" alt="TIFR Hyderabad" />
        </a>
        <blockquote class="auth-quote">
          <p>
            A scientific institution, be it a laboratory or an academy, has to
            be grown with great care like a tree...
          </p>
          <cite>Hombi J. Bhabha</cite>
        </blockquote>
      </div>

      <div class="auth-panel">
        <div class="auth-panel-inner">
          <img
            src="/assets/img/tifr-hyderabad-logo.png"
            alt="TIFR Hyderabad"
            class="auth-panel-logo"
          />
          <a href="/" class="auth-back">← Back to Instruments Home</a>
          <h1>Member Sign in</h1>
          <p class="auth-sub">Access the instrument booking portal.</p>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                autocomplete="username"
                required
              />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Sign in
            </button>
          </form>

          <p id="message" class="alert" hidden></p>

          <p class="auth-switch">
            New here? <a href="/register">Create an account</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      // Skip the login screen if a session already exists.
      if (localStorage.getItem("lab_token")) {
        window.location.href = "/manage";
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const usernameInput = document.getElementById("username").value;
          const passwordInput = document.getElementById("password").value;
          const messageDiv = document.getElementById("message");

          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: usernameInput,
                password: passwordInput,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              localStorage.setItem("lab_token", data.accesstoken);
              window.location.href = "/manage";
            } else {
              messageDiv.hidden = false;
              messageDiv.className = "alert alert-error";
              messageDiv.innerText =
                data.error || data.message || "Login failed.";
            }
          } catch (error) {
            console.error("Fetch error:", error);
            messageDiv.hidden = false;
            messageDiv.className = "alert alert-error";
            messageDiv.innerText = "Network error. Is the server running?";
          }
        });
    </script>
  </body>
</html>
