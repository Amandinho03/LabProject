<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register - CCIF</title>
    <style>
      /* the base */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f7f6;
        color: #333;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        background-color: #e9ecef;
        padding: 20px;
        border-bottom: 1px solid #ccc;
      }
      nav a {
        text-decoration: none;
        font-size: 16px;
        color: white;
        background: #0056b3;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
      }

      /* centering */
      .container {
        max-width: 400px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #0056b3;
        margin-top: 0;
      }

      /* input styling */
      .form-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }
      label {
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        color: white;
        background: #0056b3;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
      button:hover {
        background: #003d82;
      }

      /* alert message area */
      #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
        padding: 10px;
        border-radius: 4px;
        display: none;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <!-- navigation bar -->
    <nav>
      <a href="/">Home</a>
      <a href="/login">Login</a>
    </nav>

    <!-- Registration Form -->
    <div class="container">
      <h2>Register New Scientist</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" required />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" required />
        </div>

        <button type="submit">Create Account</button>
      </form>

      <!-- for success/error messages from Zod -->
      <div id="message"></div>
    </div>

    <script>
      document
        .getElementById("register-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          // fetch user details
          const usernameInput = document.getElementById("username").value;
          const passwordInput = document.getElementById("password").value;
          const messageDiv = document.getElementById("message");

          try {
            // post request
            const response = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: usernameInput,
                password: passwordInput,
              }),
            });

            const data = await response.json();
            messageDiv.style.display = "block";

            if (response.ok) {
              // success, login now
              messageDiv.className = "success";
              messageDiv.innerHTML = `Success! Account created. <br> <a href="/login">Click here to log in</a>`;
              document.getElementById("register-form").reset();
            } else {
              // registration fail
              messageDiv.className = "error";
              // Zod error handling
              const errorText =
                data.error || data.message || "Registration invalid.";
              messageDiv.innerText = `Error: ${errorText}`;
            }
          } catch (error) {
            console.error("Fetch error:", error);
            messageDiv.style.display = "block";
            messageDiv.className = "error";
            messageDiv.innerText = "Network error. Is the server running?";
          }
        });
    </script>
  </body>
</html>
