<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Research Portal</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
  </head>

  <body class="min-h-screen bg-gray-50 text-gray-900 font-sans antialiased">
    <div class="grid min-h-screen grid-cols-1 md:grid-cols-[45%_1fr]">
      <div class="relative hidden overflow-hidden bg-[#1f2021] md:block">
        <a
          href="/"
          class="absolute top-8 left-8 z-20 flex items-center gap-2 bg-white/95 hover:bg-white px-3 py-2 rounded-md shadow-sm transition-colors text-gray-800 no-underline"
        >
          <img src="/assets/back.svg" alt="Logo" class="h-3 w-auto" />
          <img src="/assets/img/sure.png" alt="Logo" class="h-7 w-auto" />
        </a>
        <img
          id="hero-image"
          src="/assets/img/dot.png"
          alt="Hero Background"
          class="absolute inset-0 w-full h-full object-cover object-[center_12%] z-0"
        />

        <div
          class="absolute inset-0 z-10"
          style="
            background:
              linear-gradient(
                190deg,
                rgba(31, 32, 33, 0) 35%,
                rgba(10, 58, 24, 0.92) 100%
              ),
              linear-gradient(
                100deg,
                rgba(59, 181, 74, 0.28),
                rgba(31, 32, 33, 0.05) 45%
              );
          "
        ></div>

        <blockquote
          class="absolute bottom-9 left-8 right-8 z-20 text-white m-0"
        >
          <p
            id="hero-quote"
            class="font-serif italic text-[1.2rem] leading-[1.5] mb-[0.6em]"
          >
            "Look again at that dot. That's here. That's home. That's us."
          </p>
          <cite id="hero-author" class="not-italic text-[1.2rem] text-white/80"
            >- Carl Sagan</cite
          >
        </blockquote>
      </div>

      <div class="flex flex-col justify-center items-center p-8 w-full">
        <div
          class="w-full max-w-md bg-white p-10 rounded-xl shadow-md border border-gray-100"
        >
          <div class="flex justify-center mb-8">
            <div class="flex items-center justify-center">
              <a href="/">
                <img
                  src="/assets/logo.svg"
                  alt="Research Institute Logo"
                  class="h-44 w-auto object-contain"
                />
              </a>
            </div>
          </div>

          <h1 class="text-2xl font-bold mb-2 text-center text-gray-800">
            Create your account
          </h1>

          <form class="space-y-5" id="register-form" novalidate>
            <div>
              <label
                for="username"
                class="block text-sm font-medium text-gray-700 mb-1"
              >
                Username
              </label>
              <input
                type="text"
                id="username"
                autocomplete="username"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                required
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700 mb-1"
              >
                Password
              </label>
              <input
                type="password"
                id="password"
                autocomplete="new-password"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                required
              />
            </div>

            <div class="pt-2">
              <button
                type="submit"
                class="w-full bg-primary text-white font-semibold py-2 px-4 rounded-md hover:bg-primary-dark transition-all"
              >
                Create account
              </button>
            </div>
          </form>

          <p
            id="message"
            class="hidden mt-4 p-3 rounded-md text-sm font-medium border"
          ></p>

          <p class="mt-6 text-sm text-center text-gray-500">
            Already registered?
            <a href="/login" class="text-primary hover:underline font-medium"
              >Sign in</a
            >
          </p>
        </div>
      </div>
    </div>

    <!-- <script src="/js/auth-hero.js"></script> -->
    <script>
      if (localStorage.getItem("lab_token")) {
        window.location.href = "/manage";
      }

      document
        .getElementById("register-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const usernameInput = document.getElementById("username").value;
          const passwordInput = document.getElementById("password").value;
          const messageDiv = document.getElementById("message");

          try {
            const response = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: usernameInput,
                password: passwordInput,
              }),
            });

            const data = await response.json();
            messageDiv.classList.remove("hidden");

            if (response.ok) {
              messageDiv.className =
                "mt-4 p-3 rounded-md text-sm font-medium border bg-success-bg text-success-text border-success-border";
              messageDiv.innerHTML = `Account created. <a href="/login" class="underline font-bold">Sign in now</a>.`;
              document.getElementById("register-form").reset();
            } else {
              messageDiv.className =
                "mt-4 p-3 rounded-md text-sm font-medium border bg-error-bg text-error-text border-error-border";
              let errorText = "Registration invalid.";
              if (data.errors && Array.isArray(data.errors)) {
                errorText = data.errors.map((err) => err.message).join("<br>");
              } else {
                errorText = data.error || data.message || errorText;
              }
              messageDiv.innerHTML = errorText;
            }
          } catch (error) {
            console.error("Fetch error:", error);
            messageDiv.classList.remove("hidden");
            messageDiv.className =
              "mt-4 p-3 rounded-md text-sm font-medium border bg-error-bg text-error-text border-error-border";
            messageDiv.innerText = "Network error. Is the server running?";
          }
        });
    </script>
  </body>
</html>
