<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Requests - CCIF</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f4f7f6;
        color: #333;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        background-color: #e9ecef;
        padding: 20px;
        border-bottom: 1px solid #ccc;
      }
      nav a,
      nav button {
        text-decoration: none;
        font-size: 16px;
        color: white;
        background: #0056b3;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
        border: none;
        cursor: pointer;
      }
      nav button {
        background: #dc3545;
      }
      nav button:hover {
        background: #c82333;
      }

      .container {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
      }
      h2 {
        color: #0056b3;
        margin-top: 0;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 10px;
      }

      .form-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }
      label {
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      select {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .readonly-field {
        background-color: #e9ecef;
        color: #6c757d;
        cursor: not-allowed;
      }

      .action-selector {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        border: 1px solid #dee2e6;
        margin-bottom: 20px;
      }
      .radio-group {
        margin-bottom: 8px;
        font-size: 16px;
        display: block;
      }

      .dynamic-section {
        display: none;
        padding: 15px;
        border: 1px solid #b8daff;
        background: #e2eafc;
        border-radius: 5px;
        margin-bottom: 15px;
      }
      .active-section {
        display: block;
      }

      .btn-submit {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        color: white;
        background: #0056b3;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
      .alert {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        display: none;
        font-weight: bold;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
        background: white;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 12px;
        text-align: left;
      }
      th {
        background-color: #0056b3;
        color: white;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <button id="logout-btn">Logout</button>
    </nav>

    <div class="container">
      <h2>Manage Lab Requests</h2>

      <div class="form-group">
        <label>Scientist Username:</label>
        <input
          type="text"
          id="profile-username"
          class="readonly-field"
          readonly
          disabled
        />
      </div>

      <div class="action-selector">
        <label class="radio-group"
          ><input type="radio" name="actionType" value="add" /> Add New
          Request</label
        >
        <label class="radio-group"
          ><input type="radio" name="actionType" value="edit" /> Edit Existing
          Request</label
        >

        <!-- hide from regular user -->
        <div id="admin-options" style="display: none">
          <label class="radio-group"
            ><input type="radio" name="actionType" value="status" /> Modify
            Status
          </label>
          <label class="radio-group"
            ><input type="radio" name="actionType" value="delete" /> Delete
            Request
          </label>
        </div>
      </div>

      <form id="unified-form">
        <!-- add request -->
        <div id="section-add" class="dynamic-section">
          <h3>Add Request</h3>
          <div class="form-group">
            <label for="add-machine">Select Machine:</label>
            <select id="add-machine">
              <option value="">-- Loading... --</option>
            </select>
          </div>
        </div>

        <!-- edit machine -->
        <div id="section-edit" class="dynamic-section">
          <h3>Edit Request</h3>
          <div class="form-group">
            <label for="edit-id">Select Experiment:</label>
            <select id="edit-id" class="exp-dropdown">
              <option value="">-- Loading... --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-machine">Change Machine To:</label>
            <select id="edit-machine">
              <option value="">-- Select an ID first --</option>
            </select>
          </div>
        </div>

        <!-- modify status (admin) -->
        <div id="section-status" class="dynamic-section">
          <h3>Modify Status</h3>
          <div class="form-group">
            <label for="status-id">Select Experiment:</label>
            <select id="status-id" class="exp-dropdown">
              <option value="">-- Loading... --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modify-status">Change Status To:</label>
            <select id="modify-status">
              <option value="">-- Select an ID first --</option>
            </select>
          </div>
        </div>

        <!-- delete option (admin) -->
        <div id="section-delete" class="dynamic-section">
          <h3>Delete Request</h3>
          <div class="form-group">
            <label for="delete-id">Select Experiment to Cancel:</label>
            <select id="delete-id" class="exp-dropdown">
              <option value="">-- Loading... --</option>
            </select>
          </div>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="btn-submit"
          style="display: none"
        >
          Execute Action
        </button>
      </form>
      <div id="status-msg" class="alert"></div>
    </div>

    <!-- dashboard -->
    <div class="container">
      <h2>Lab Request Dashboard</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Scientist</th>
            <th>Machine</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <script type="module">
      import { loadDashboard } from "./dashboard.js";

      // auth check
      const token = localStorage.getItem("lab_token");
      if (!token) {
        alert("You must be logged in!");
        window.location.href = "/login";
        throw new Error("User not authenticated!");
      }

      function parseJwt(token) {
        try {
          return JSON.parse(
            window.atob(
              token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"),
            ),
          );
        } catch (e) {
          return {};
        }
      }

      const userData = parseJwt(token);
      document.getElementById("profile-username").value =
        userData.username || "Unknown";

      if (userData.role === "admin") {
        document.getElementById("admin-options").style.display = "block";
      }

      let allExperiments = [];
      let ALL_MACHINES = [];
      let ALL_STATUSES = [];

      // fetch config
      async function fetchConfig() {
        try {
          const res = await fetch("/api/config");
          const data = await res.json();
          if (data.success) {
            ALL_MACHINES = data.data.machines;
            ALL_STATUSES = data.data.statuses;

            // populate dropdown dynamically
            const addMachineDropdown = document.getElementById("add-machine");
            addMachineDropdown.innerHTML = ALL_MACHINES.map(
              (m) => `<option value="${m}">${m}</option>`,
            ).join("");
          }
        } catch (error) {
          console.error("Config fetch error:", error);
        }
      }

      // fetch dashboard data
      async function fetchLiveDashboard() {
        try {
          const res = await fetch("/api/experiments");
          const data = await res.json();

          if (data.success) {
            allExperiments = data.data;

            loadDashboard(allExperiments);

            let adminOptions = [];
            let userOptions = [];

            allExperiments.forEach((exp) => {
              const option = new Option(
                `ID: ${exp.id} - ${exp.scientist} - ${exp.machine} - ${exp.status}`,
                exp.id,
              );
              adminOptions.push(option);

              if (
                userData.role === "admin" ||
                exp.scientist === userData.username
              ) {
                userOptions.push(option.cloneNode(true));
              }
            });

            const editId = document.getElementById("edit-id");
            if (!editId.value) {
              editId.innerHTML =
                '<option value="">-- Select an Experiment --</option>';
              userOptions.forEach((opt) =>
                editId.appendChild(opt.cloneNode(true)),
              );
            }

            const statusId = document.getElementById("status-id");
            if (!statusId.value) {
              statusId.innerHTML =
                '<option value="">-- Select an Experiment --</option>';
              adminOptions.forEach((opt) =>
                statusId.appendChild(opt.cloneNode(true)),
              );
            }

            const deleteId = document.getElementById("delete-id");
            if (!deleteId.value) {
              deleteId.innerHTML =
                '<option value="">-- Select an Experiment --</option>';
              adminOptions.forEach((opt) =>
                deleteId.appendChild(opt.cloneNode(true)),
              );
            }
          }
        } catch (error) {
          console.error("Dashboard error:", error);
        }
      }

      // initializing page
      async function initPage() {
        await fetchConfig();
        await fetchLiveDashboard();
      }
      initPage();

      // dynamic dropdown menu
      document
        .getElementById("edit-id")
        .addEventListener("change", function () {
          const exp = allExperiments.find((e) => e.id == this.value);
          const machineSelect = document.getElementById("edit-machine");
          if (!exp)
            return (machineSelect.innerHTML =
              '<option value="">-- Select an ID first --</option>');

          let html = "";
          ALL_MACHINES.forEach((m) => {
            if (m !== exp.machine) html += `<option value="${m}">${m}</option>`;
          });
          machineSelect.innerHTML = html;
        });

      document
        .getElementById("status-id")
        .addEventListener("change", function () {
          const exp = allExperiments.find((e) => e.id == this.value);
          const statusSelect = document.getElementById("modify-status");
          if (!exp)
            return (statusSelect.innerHTML =
              '<option value="">-- Select an ID first --</option>');

          let html = "";
          ALL_STATUSES.forEach((s) => {
            if (s !== exp.status) html += `<option value="${s}">${s}</option>`;
          });
          statusSelect.innerHTML = html;
        });

      // toggle the sections
      let currentAction = null;
      document.querySelectorAll('input[name="actionType"]').forEach((radio) => {
        radio.addEventListener("change", (e) => {
          currentAction = e.target.value;
          document
            .querySelectorAll(".dynamic-section")
            .forEach((el) => el.classList.remove("active-section"));
          document
            .getElementById(`section-${currentAction}`)
            .classList.add("active-section");

          const btn = document.getElementById("submit-btn");
          btn.style.display = "block";
          btn.innerText =
            currentAction === "delete" || currentAction === "status"
              ? "Execute Action (Admin)"
              : "Submit Request";
          btn.style.background =
            currentAction === "delete" ? "#dc3545" : "#0056b3";
        });
      });

      // submit form
      document
        .getElementById("unified-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
          let url = "/api/experiments";
          let method = "";
          let payload = {};

          if (currentAction === "add") {
            method = "POST";
            payload = { machine: document.getElementById("add-machine").value };
          } else if (currentAction === "edit") {
            const expId = document.getElementById("edit-id").value;
            if (!expId) return alert("Please select an ID.");
            url += `/${expId}`;
            method = "PATCH";
            payload = {
              machine: document.getElementById("edit-machine").value,
            };
          } else if (currentAction === "status") {
            const expId = document.getElementById("status-id").value;
            if (!expId) return alert("Please select an ID.");
            url += `/${expId}`;
            method = "PATCH";
            payload = {
              status: document.getElementById("modify-status").value,
            };
          } else if (currentAction === "delete") {
            const expId = document.getElementById("delete-id").value;
            if (!expId) return alert("Please select an ID.");
            url += `/${expId}`;
            method = "DELETE";
          }

          try {
            const options = {
              method: method,
              headers: { Authorization: `Bearer ${token}` },
            };
            if (method !== "DELETE") {
              options.headers["Content-Type"] = "application/json";
              options.body = JSON.stringify(payload);
            }

            const response = await fetch(url, options);
            const data = await response.json();

            const msgEl = document.getElementById("status-msg");
            msgEl.style.display = "block";
            msgEl.className = response.ok ? "alert success" : "alert error";
            msgEl.innerText = response.ok
              ? "Success!"
              : `Error: ${data.message || data.error}`;

            if (response.ok) {
              document.getElementById("edit-id").value = "";
              document.getElementById("status-id").value = "";
              document.getElementById("delete-id").value = "";
              document.getElementById("edit-machine").innerHTML =
                '<option value="">-- Select an ID first --</option>';
              document.getElementById("modify-status").innerHTML =
                '<option value="">-- Select an ID first --</option>';
              fetchLiveDashboard();
            }
          } catch (error) {
            alert("Network Error");
          }
        });

      // logout button
      document
        .getElementById("logout-btn")
        .addEventListener("click", async function () {
          await fetch("/logout", { method: "POST" });
          localStorage.removeItem("lab_token");
          window.location.href = "/login";
        });
    </script>
  </body>
</html>
